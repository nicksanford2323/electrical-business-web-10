    <!-- Matomo Tag Manager -->
    <script>
      var _mtm = window._mtm = window._mtm || [];
      _mtm.push({'mtm.startTime': (new Date().getTime()), 'event': 'mtm.Start'});
      (function() {
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src='https://cdn.matomo.cloud/alplumberssitevercelapp.matomo.cloud/container_MJkd8xbh.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Tag Manager -->
    <!-- Business View Tracking -->
    <script>
      function trackBusinessView() {
        const urlParams = new URLSearchParams(window.location.search);
        const businessId = urlParams.get('id');
        
        if(businessId) {
          // Track in Matomo
          if(window._mtm) {
            _mtm.push(['trackEvent', 'Business View', 'View', businessId]);
          }
          
          // Send to High Level
          fetch('https://services.leadconnectorhq.com/hooks/2CUu2UzbKL9UUAOvmqJR/webhook-trigger/a990e8c5-8408-45ff-8c18-58cb84f6adb3', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              businessId: businessId,
              action: 'view',
              timestamp: new Date().toISOString(),
              url: window.location.href
            })
          })
          .then(response => console.log('High Level webhook sent successfully'))
          .catch(error => console.error('Error sending webhook:', error));
        }
      }

      // Run tracking when page loads
      document.addEventListener('DOMContentLoaded', trackBusinessView);
    </script>
