    <!-- Business View Tracking -->
    <script>
      async function trackBusinessView() {
          const urlParams = new URLSearchParams(window.location.search);
          const businessId = urlParams.get('id');
          
          if(businessId) {
              try {
                  console.log('Fetching business data for:', businessId);
                  
                  // Fetch business data from GitHub
                  const response = await fetch('https://raw.githubusercontent.com/nicksanford2323/business-data-fixed2/main/data.json');
                  const data = await response.json();
                  console.log('Fetched data:', data);
                  
                  // Look for the business using the ID
                  const businessData = data[businessId];
                  console.log('Found business data:', businessData);
                  
                  if(businessData && businessData.businessInfo) {
                      // Send to High Level with just business ID and phone
                      const webhookData = {
                          businessId: businessId,
                          businessName: businessData.businessName,
                          phone: businessData.businessInfo.phone
                      };
                      
                      console.log('Sending webhook data:', webhookData);
                      
                      const response = await fetch('https://services.leadconnectorhq.com/hooks/2CUu2UzbKL9UUAOvmqJR/webhook-trigger/a990e8c5-8408-45ff-8c18-58cb84f6adb3', {
                          method: 'POST',
                          headers: {
                              'Content-Type': 'application/json'
                          },
                          body: JSON.stringify(webhookData)
                      });
                      
                      console.log('Webhook response:', response.status);
                  } else {
                      console.error('Business data not found for ID:', businessId);
                  }
              } catch(error) {
                  console.error('Error in trackBusinessView:', error);
              }
          }
      }

      // Wait for DOM and then track
      document.addEventListener('DOMContentLoaded', trackBusinessView);
    </script>
